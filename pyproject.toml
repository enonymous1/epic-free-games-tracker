[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epic-free-games-tracker"
version = "2.0.0"
description = "Track current and upcoming free games on the Epic Games Store from its public promotions feed."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "enonymous1" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
epic-free-games = "epic_free_games_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
warn_unused_ignores = true
