[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epic-free-games-tracker"
dynamic = ["version"]
description = "Track current and upcoming free games on the Epic Games Store from its public promotions feed."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "enonymous1" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.7,<3",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
epic-free-games = "epic_free_games_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "epic_free_games_tracker.__version__" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "D"]
ignore = ["D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]

[tool.mypy]
strict = true
warn_unused_ignores = true
files = ["src", "tests"]

[tool.coverage.run]
source = ["epic_free_games_tracker"]
branch = true

[tool.coverage.report]
show_missing = true
